name: Deploy to GitHub Pages

on:
  push:
    branches: 'main' # Скрипт сработает при пуше в ветку main

# Разрешения, необходимые для публикации на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Отменяет текущую сборку, если запущена новая
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps:deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9 # или укажите версию из вашего pnpm-lock.yaml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Папка, куда Vite складывает готовую сборку

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
